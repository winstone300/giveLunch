<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf?.token}">
    <meta name="_csrf_header" th:content="${_csrf?.headerName}">
    <title>GiveLunch 관리자 - 데이터베이스 관리</title>
    <style>
        :root {
            font-family: "Pretendard", "Noto Sans KR", sans-serif;
            color: #1f2937;
            background-color: #f8fafc;
        }
        body {
            margin: 0;
            padding: 32px 24px 48px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
        }
        .logout-btn {
            background: #e2e8f0;
            color: #1f2937;
            font-weight: 600;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 12px;
        }
        .subtitle {
            color: #64748b;
            margin-bottom: 28px;
        }
        .layout {
            display: grid;
            grid-template-columns: minmax(280px, 360px) 1fr;
            gap: 28px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }
        .search-group {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px;
        }
        .search-group input {
            flex: 1;
        }
        label {
            font-size: 13px;
            color: #475569;
        }
        input {
            border: 1px solid #cbd5f5;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 14px;
        }
        .actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        button {
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            cursor: pointer;
        }
        .primary {
            background: #2563eb;
            color: #ffffff;
        }
        .secondary {
            background: #e2e8f0;
            color: #1f2937;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }
        th {
            background-color: #f1f5f9;
            color: #475569;
        }
        .table-actions {
            display: flex;
            gap: 6px;
        }
        .danger {
            background: #ef4444;
            color: #fff;
        }
        .notice {
            margin-top: 12px;
            color: #64748b;
            font-size: 13px;
        }
        .list-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 12px;
        }
        .list-controls input {
            flex: 1;
        }
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
        }
        .pagination-actions {
            display: flex;
            gap: 8px;
        }
        .empty-row {
            text-align: center;
            color: #64748b;
            padding: 18px 12px;
        }
        .modal-overlay {
             position: fixed;
             inset: 0;
             background: rgba(15, 23, 42, 0.35);
             display: flex;
             align-items: center;
             justify-content: center;
             z-index: 1000;
             padding: 24px;
         }
        .modal-overlay.hidden {
            display: none;
        }
        .modal {
            width: min(560px, 100%);
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.2);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 700;
        }
        .modal-close {
            background: transparent;
            font-size: 20px;
            line-height: 1;
            padding: 4px 8px;
        }
        .modal-results {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 60vh;
            overflow: auto;
        }
        .result-card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            background: #f8fafc;
        }
        .result-image {
            width: 64px;
            height: 64px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid #e2e8f0;
            background: #fff;
        }
        .result-info {
            flex: 1;
        }
        .result-title {
            font-weight: 600;
        }
        .result-meta {
            color: #64748b;
            font-size: 12px;
            margin-top: 4px;
        }
        .result-meta a {
            color: #2563eb;
            text-decoration: none;
        }
        .result-meta a:hover {
            text-decoration: underline;
        }
        .result-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        @media (max-width: 960px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="header">
    <h1>🍱 foods / nutritions 관리</h1>
    <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}">
        <button type="submit" class="logout-btn">로그아웃</button>
    </form>
</div>
<div class="subtitle">음식 정보와 영양 정보를 등록, 수정, 삭제할 수 있습니다.</div>

<div class="layout">
    <section class="card">
        <h2>음식 등록/수정</h2>
        <div class="form-group">
            <label for="food-search">외부 데이터 검색</label>
            <div class="search-group">
                <input id="food-search" type="text" placeholder="예: 김치찌개">
                <button class="secondary" type="button" id="search-btn">검색</button>
            </div>
            <div class="notice" id="search-status"></div>
        </div>
        <form id="food-form">
            <input type="hidden" id="food-id">
            <div class="form-group">
                <label for="food-name">이름 (필수)</label>
                <input id="food-name" type="text" required placeholder="예: 김치찌개">
            </div>
            <div class="form-group">
                <label for="food-category">카테고리</label>
                <input id="food-category" type="text" placeholder="예: 한식">
            </div>
            <div class="form-group">
                <label for="food-img">이미지 URL</label>
                <input id="food-img" type="url" placeholder="https://...">
            </div>
            <div class="form-group">
                <label for="food-serving">1회 제공량 (g)</label>
                <input id="food-serving" type="number" min="0" step="1" placeholder="예: 300">
            </div>
            <div class="form-group">
                <label for="food-calories">칼로리 (kcal)</label>
                <input id="food-calories" type="number" min="0" step="0.01" placeholder="예: 550">
            </div>
            <div class="form-group">
                <label for="food-carb">탄수화물 (g)</label>
                <input id="food-carb" type="number" min="0" step="0.01" placeholder="예: 60">
            </div>
            <div class="form-group">
                <label for="food-protein">단백질 (g)</label>
                <input id="food-protein" type="number" min="0" step="0.01" placeholder="예: 25">
            </div>
            <div class="form-group">
                <label for="food-fat">지방 (g)</label>
                <input id="food-fat" type="number" min="0" step="0.01" placeholder="예: 18">
            </div>
            <div class="actions">
                <button class="primary" type="submit">저장</button>
                <button class="secondary" type="button" id="reset-btn">초기화</button>
            </div>
        </form>
        <div class="notice" id="form-status"></div>
    </section>

    <section class="card">
        <h2>등록된 음식 목록</h2>
        <div class="list-controls">
            <input id="list-search-keyword" type="text" placeholder="이름으로 검색">
            <button class="secondary" type="button" id="list-search-btn">검색</button>
            <button class="secondary" type="button" id="list-search-reset-btn">초기화</button>
        </div>
        <table>
            <thead>
            <tr>
                <th>이름</th>
                <th>카테고리</th>
                <th>액션</th>
            </tr>
            </thead>
            <tbody id="food-table-body"></tbody>
        </table>
        <div class="pagination">
            <div class="notice" id="list-page-info">0 / 0 페이지</div>
            <div class="pagination-actions">
                <button class="secondary" type="button" id="list-prev-btn">이전</button>
                <button class="secondary" type="button" id="list-next-btn">다음</button>
            </div>
        </div>
        <div class="notice">표시되는 칼로리는 1회 제공량 기준입니다.</div>
    </section>
</div>

<div class="modal-overlay hidden" id="search-modal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="search-modal-title">
        <div class="modal-header">
            <div class="modal-title" id="search-modal-title">외부 데이터 검색 결과</div>
            <button class="modal-close" type="button" id="search-modal-close" aria-label="닫기">✕</button>
        </div>
        <div class="modal-results" id="search-results"></div>
    </div>
</div>

<script>
    const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');
    const form = document.getElementById('food-form');
    const formStatus = document.getElementById('form-status');
    const tableBody = document.getElementById('food-table-body');
    const searchInput = document.getElementById('food-search');
    const searchButton = document.getElementById('search-btn');
    const searchStatus = document.getElementById('search-status');
    const searchResults = document.getElementById('search-results');
    const searchModal = document.getElementById('search-modal');
    const searchModalClose = document.getElementById('search-modal-close');
    const listSearchKeyword = document.getElementById('list-search-keyword');
    const listSearchButton = document.getElementById('list-search-btn');
    const listSearchResetButton = document.getElementById('list-search-reset-btn');
    const listPrevButton = document.getElementById('list-prev-btn');
    const listNextButton = document.getElementById('list-next-btn');
    const listPageInfo = document.getElementById('list-page-info');

    const listState = {
        page: 0,
        size: 10,
        keyword: '',
        totalPages: 0,
        totalElements: 0
    };

    const fields = {
        id: document.getElementById('food-id'),
        name: document.getElementById('food-name'),
        category: document.getElementById('food-category'),
        imgUrl: document.getElementById('food-img'),
        servingSizeG: document.getElementById('food-serving'),
        calories: document.getElementById('food-calories'),
        carbohydrate: document.getElementById('food-carb'),
        protein: document.getElementById('food-protein'),
        fat: document.getElementById('food-fat')
    };

    const request = (url, options = {}) => {
        const headers = options.headers ? {...options.headers} : {};
        if (csrfToken && csrfHeader && options.method && options.method !== 'GET') {
            headers[csrfHeader] = csrfToken;
        }
        return fetch(url, {...options, headers});
    };

    const getPayload = () => ({
        name: fields.name.value.trim(),
        category: fields.category.value.trim() || null,
        imgUrl: fields.imgUrl.value.trim() || null,
        servingSizeG: fields.servingSizeG.value ? Number(fields.servingSizeG.value) : null,
        nutrition: {
            calories: fields.calories.value ? Number(fields.calories.value) : null,
            carbohydrate: fields.carbohydrate.value ? Number(fields.carbohydrate.value) : null,
            protein: fields.protein.value ? Number(fields.protein.value) : null,
            fat: fields.fat.value ? Number(fields.fat.value) : null
        }
    });

    const resetForm = () => {
        form.reset();
        fields.id.value = '';
        formStatus.textContent = '';
    };

    const openSearchModal = () => {
        searchModal.classList.remove('hidden');
        searchModal.setAttribute('aria-hidden', 'false');
    };

    const closeSearchModal = () => {
        searchModal.classList.add('hidden');
        searchModal.setAttribute('aria-hidden', 'true');
    };

    const applyExternalFood = (dto) => {
        fields.id.value = '';
        fields.name.value = dto.name ?? '';
        fields.category.value = dto.category ?? '';
        fields.imgUrl.value = dto.imgUrl ?? '';
        fields.servingSizeG.value = dto.servingSizeG ?? '';
        fields.calories.value = dto.nutrition?.calories ?? '';
        fields.carbohydrate.value = dto.nutrition?.carbohydrate ?? '';
        fields.protein.value = dto.nutrition?.protein ?? '';
        fields.fat.value = dto.nutrition?.fat ?? '';
    };

    const renderSearchResults = (results) => {
        searchResults.innerHTML = '';
        if (!results.length) {
            searchResults.textContent = '검색 결과가 없습니다.';
            openSearchModal();
            return;
        }

        results.forEach((item) => {
            const card = document.createElement('div');
            card.className = 'result-card';

            if (item.imgUrl) {
                const image = document.createElement('img');
                image.className = 'result-image';
                image.src = item.imgUrl;
                image.alt = `${item.name ?? '음식'} 이미지`;
                card.appendChild(image);
            }

            const info = document.createElement('div');
            info.className = 'result-info';
            const title = document.createElement('div');
            title.className = 'result-title';
            title.textContent = item.name ?? '이름 없음';

            const meta = document.createElement('div');
            meta.className = 'result-meta';
            const details = [
                item.category ? `카테고리: ${item.category}` : null,
                item.servingSizeG ? `1회 제공량: ${item.servingSizeG}g` : null,
                item.nutrition?.calories ? `칼로리: ${item.nutrition.calories}kcal` : null
            ].filter(Boolean);
            meta.textContent = details.join(' · ') || '세부 정보 없음';

            if (item.imgUrl) {
                const link = document.createElement('a');
                link.href = item.imgUrl;
                link.target = '_blank';
                link.rel = 'noopener';
                link.textContent = '이미지 URL';
                meta.appendChild(document.createTextNode(details.length ? ' · ' : ''));
                meta.appendChild(link);
            }


            info.appendChild(title);
            info.appendChild(meta);

            const actions = document.createElement('div');
            actions.className = 'result-actions';
            const selectButton = document.createElement('button');
            selectButton.type = 'button';
            selectButton.className = 'secondary';
            selectButton.textContent = '선택';
            selectButton.addEventListener('click', () => {
                applyExternalFood(item);
                formStatus.textContent = '외부 데이터 불러오기 완료';
                closeSearchModal();
            });

            actions.appendChild(selectButton);
            card.appendChild(info);
            card.appendChild(actions);

            searchResults.appendChild(card);
        });
        openSearchModal();
    };


    const searchExternalFood = async () => {
        const name = searchInput.value.trim();
        if (!name) {
            searchStatus.textContent = '검색할 음식 이름을 입력해주세요.';
            searchResults.innerHTML = '';
            return;
        }
        searchStatus.textContent = '외부 데이터 조회 중...';
        searchResults.innerHTML = '';
        const resp = await fetch(`/api/foods/search/external?name=${encodeURIComponent(name)}`);
        if (!resp.ok) {
            searchStatus.textContent = '검색 결과가 없습니다.';
            renderSearchResults([]);
            return;
        }
        const data = await resp.json();
        const results = Array.isArray(data) ? data : [data];
        searchStatus.textContent = `${results.length}건 검색 완료`;
        renderSearchResults(results);
    };


    const renderRows = (foods) => {
        tableBody.innerHTML = '';

        if (!foods.length) {
            const row = document.createElement('tr');
            row.innerHTML = '<td class="empty-row" colspan="3">검색 결과가 없습니다.</td>';
            tableBody.appendChild(row);
            return;
        }

        foods.forEach((food) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${food.name}</td>
                <td>${food.category ?? '-'}</td>
                <td class="table-actions">
                    <button class="secondary" data-action="edit">수정</button>
                    <button class="danger" data-action="delete">삭제</button>
                </td>
            `;

            row.querySelector('[data-action="edit"]').addEventListener('click', async () => {
                fields.id.value = food.id;
                fields.name.value = food.name ?? '';
                fields.category.value = food.category ?? '';
                fields.imgUrl.value = food.imgUrl ?? '';
                fields.servingSizeG.value = food.servingSizeG ?? '';
                fields.calories.value = '';
                fields.carbohydrate.value = '';
                fields.protein.value = '';
                fields.fat.value = '';
                formStatus.textContent = `ID ${food.id} 영양 정보 불러오는 중...`;

                const nutrition = await loadNutrition(food.id);
                if (nutrition) {
                    fields.calories.value = nutrition.calories ?? '';
                    fields.carbohydrate.value = nutrition.carbohydrate ?? '';
                    fields.protein.value = nutrition.protein ?? '';
                    fields.fat.value = nutrition.fat ?? '';
                    formStatus.textContent = `ID ${food.id} 수정 중`;
                } else {
                    formStatus.textContent = `ID ${food.id} 수정 중 (영양 정보 없음)`;
                }
            });

            row.querySelector('[data-action="delete"]').addEventListener('click', async () => {
                if (!confirm(`${food.name} 항목을 삭제할까요?`)) {
                    return;
                }
                const resp = await request(`/api/admin/foods/${food.id}`, {method: 'DELETE'});
                if (!resp.ok) {
                    formStatus.textContent = '삭제에 실패했습니다.';
                    return;
                }
                formStatus.textContent = '삭제 완료';
                await loadFoods();
                if (fields.id.value === String(food.id)) {
                    resetForm();
                }
            });

            tableBody.appendChild(row);
        });
    };

    const updatePagination = () => {
        const currentPage = listState.totalPages === 0 ? 0 : listState.page + 1;
        listPageInfo.textContent = `${currentPage} / ${listState.totalPages} 페이지 · 총 ${listState.totalElements}건`;
        listPrevButton.disabled = listState.page <= 0;
        listNextButton.disabled = listState.page + 1 >= listState.totalPages;
    };

    const loadFoods = async () => {
        const params = new URLSearchParams({
            page: String(listState.page),
            size: String(listState.size)
        });
        if (listState.keyword) {
            params.set('keyword', listState.keyword);
        }

        const resp = await fetch(`/api/admin/foods?${params.toString()}`);
        if (!resp.ok) {
            formStatus.textContent = '목록을 불러오지 못했습니다.';
            return;
        }
        const data = await resp.json();

        if (listState.page > 0 && data.totalPages > 0 && listState.page >= data.totalPages) {
            listState.page = data.totalPages - 1;
            await loadFoods();
            return;
        }

        listState.totalPages = data.totalPages ?? 0;
        listState.totalElements = data.totalElements ?? 0;
        listState.page = data.number ?? 0;
        renderRows(data.content ?? []);
        updatePagination();
    };

    const loadNutrition = async (foodId) => {
        const resp = await fetch(`/api/foods/${foodId}/nutrition`);
        if (!resp.ok) {
            return null;
        }
        const data = await resp.json();
        return data.nutrition ?? null;
    };

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const payload = getPayload();

        if (!payload.name) {
            formStatus.textContent = '이름을 입력해주세요.';
            return;
        }

        const id = fields.id.value;
        const method = id ? 'PUT' : 'POST';
        const url = id ? `/api/admin/foods/${id}` : '/api/admin/foods';
        const resp = await request(url, {
            method,
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        if (!resp.ok) {
            const message = await resp.text();
            formStatus.textContent = message || '저장에 실패했습니다.';
            return;
        }
        formStatus.textContent = id ? '수정 완료' : '등록 완료';
        resetForm();
        await loadFoods();
    });

    const searchFoodList = async () => {
        listState.keyword = listSearchKeyword.value.trim();
        listState.page = 0;
        await loadFoods();
    };

    const resetFoodListSearch = async () => {
        listSearchKeyword.value = '';
        listState.keyword = '';
        listState.page = 0;
        await loadFoods();
    };

    document.getElementById('reset-btn').addEventListener('click', resetForm);
    searchButton.addEventListener('click', searchExternalFood);
    listSearchButton.addEventListener('click', searchFoodList);
    listSearchResetButton.addEventListener('click', resetFoodListSearch);
    listPrevButton.addEventListener('click', async () => {
        if (listState.page <= 0) {
            return;
        }
        listState.page -= 1;
        await loadFoods();
    });
    listNextButton.addEventListener('click', async () => {
        if (listState.page + 1 >= listState.totalPages) {
            return;
        }
        listState.page += 1;
        await loadFoods();
    });
    searchModalClose.addEventListener('click', closeSearchModal);
    searchModal.addEventListener('click', (event) => {
        if (event.target === searchModal) {
            closeSearchModal();
        }
    });
    searchInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            event.preventDefault();
            searchExternalFood();
        }
    });
    listSearchKeyword.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            event.preventDefault();
            searchFoodList();
        }
    });
    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !searchModal.classList.contains('hidden')) {
            closeSearchModal();
        }
    });

    loadFoods();
</script>
</body>
</html>
