<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>비밀번호 재설정</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
            background: #f6f7fb;
            color: #111827; }
        .wrap { min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px; }
        .card { width: 100%;
            max-width: 380px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 10px 30px rgba(0,0,0,.06); }
        h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.3px; }
        .sub { margin: 0 0 18px; color: #6b7280; font-size: 14px; }
        .error-msg {
            color: #ef4444;
            background: #fef2f2;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            border: 1px solid #fee2e2;
        }
        label { display: block; margin: 12px 0 6px; font-size: 13px; color: #374151; }
        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            background: #fff;
        }
        input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
        button {
            width: 100%; margin-top: 14px; padding: 12px 14px; border: 0;
            border-radius: 10px; background: #2563eb; color: #fff;
            font-size: 15px; font-weight: 600; cursor: pointer;
        }
        button:hover { filter: brightness(0.95); }
        .inline { display: flex; gap: 8px; }
        .inline input { flex: 1; }
        .inline button { width: 120px; margin-top: 0; padding: 11px 10px; font-size: 13px; }
        .verify-status { margin-top: 6px; font-size: 12px; min-height: 18px; }
        .verify-status.ok { color: #059669; }
        .verify-status.err { color: #dc2626; }
        .row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
        a { color: #2563eb; text-decoration: none; font-size: 13px; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h1>비밀번호 재설정</h1>
        <p class="sub">이메일로 받은 코드를 인증한 후 새 비밀번호를 입력해주세요.</p>

        <div th:if="${error}" class="error-msg" th:text="${error}"></div>

        <form method="post" th:action="@{/reset-password}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <label for="email">이메일</label>
            <input id="email" name="email" type="email" placeholder="example@email.com" required />

            <label for="code">재설정 코드</label>
            <div class="inline">
                <input id="code" name="code" type="text" placeholder="6자리 코드" maxlength="6" required />
                <button type="button" id="verifyCodeBtn">인증하기</button>
            </div>
            <div class="verify-status" id="codeStatus"></div>
            <p class="verify-status" id="initialRemainingStatus"></p>

            <label for="password">새 비밀번호</label>
            <input id="password" name="password" type="password" placeholder="••••••••" required />

            <label for="passwordConfirm">새 비밀번호 확인</label>
            <input id="passwordConfirm" name="passwordConfirm" type="password" placeholder="••••••••" required />

            <button type="submit">비밀번호 재설정</button>
        </form>

        <div class="row">
            <a th:href="@{/forgot-password}">코드 다시 받기</a>
            <a th:href="@{/login}">로그인으로</a>
        </div>
    </div>
</div>
<script>
    const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

    const initialRemainingStatusEl = document.getElementById('initialRemainingStatus');

    function formatTime(seconds) {
        const safeSeconds = Math.max(Number(seconds) || 0, 0);
        const minutes = Math.floor(safeSeconds / 60);
        const secs = safeSeconds % 60;
        return `${minutes}분 ${secs}초`;
    }

    function startPageRemainingTimer(seconds) {
        let remainingSeconds = Math.max(Number(seconds) || 0, 0);
        if (!initialRemainingStatusEl || remainingSeconds <= 0) {
            return;
        }

        const render = () => {
            initialRemainingStatusEl.textContent = `남은 인증 시간: ${formatTime(remainingSeconds)}`;
            initialRemainingStatusEl.className = 'verify-status err';
        };

        render();

        const timer = setInterval(() => {
            remainingSeconds -= 1;
            render();
            if (remainingSeconds <= 0) {
                clearInterval(timer);
            }
        }, 1000);
    }

    async function request(url, body) {
        const headers = { 'Content-Type': 'application/json' };
        if (csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;

        const res = await fetch(url, {
            method: 'POST',
            headers,
            body: JSON.stringify(body)
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
            throw new Error(data.message || '요청에 실패했습니다.');
        }
        return data;
    }

    let verificationTimer;

    function startRemainingTimerFromMessage(message) {
        clearInterval(verificationTimer);

        const match = message.match(/남은 인증 시간:\s*(\d+)분\s*(\d+)초/);
        if (!match) {
            statusEl.textContent = message;
            statusEl.className = 'verify-status err';
            return;
        }

        let remainingSeconds = Number(match[1]) * 60 + Number(match[2]);

        const render = () => {
            statusEl.textContent = `시도횟수를 초과했습니다. 남은 인증 시간: ${formatTime(remainingSeconds)}`;
            statusEl.className = 'verify-status err';
        };

        render();

        if (remainingSeconds <= 0) {
            return;
        }

        verificationTimer = setInterval(() => {
            remainingSeconds -= 1;
            render();
            if (remainingSeconds <= 0) {
                clearInterval(verificationTimer);
            }
        }, 1000);
    }

    const params = new URLSearchParams(window.location.search);
    startPageRemainingTimer(params.get('remainingSeconds'));

    const verifyButton = document.getElementById('verifyCodeBtn');
    const statusEl = document.getElementById('codeStatus');

    verifyButton.addEventListener('click', async () => {
        const email = document.getElementById('email').value.trim();
        const code = document.getElementById('code').value.trim();
        if (!email || !code) {
            statusEl.textContent = '이메일과 코드를 입력해주세요.';
            statusEl.className = 'verify-status err';
            return;
        }

        try {
            const data = await request('/reset-password/verify', { email, code });
            statusEl.textContent = data.message || '코드 인증이 완료되었습니다.';
            statusEl.className = 'verify-status ok';
        } catch (err) {
            startRemainingTimerFromMessage(err.message);
        }
    });
</script>
</body>
</html>
