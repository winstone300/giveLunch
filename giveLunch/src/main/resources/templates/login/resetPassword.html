<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>비밀번호 재설정</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
            background: #f6f7fb;
            color: #111827;
        }
        .wrap {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 380px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 10px 30px rgba(0,0,0,.06);
        }
        h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.3px; }
        .sub { margin: 0 0 18px; color: #6b7280; font-size: 14px; }
        .error-msg {
            color: #ef4444;
            background: #fef2f2;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            border: 1px solid #fee2e2;
        }
        label { display: block; margin: 12px 0 6px; font-size: 13px; color: #374151; }
        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            background: #fff;
        }
        input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
        button {
            width: 100%; margin-top: 14px; padding: 12px 14px; border: 0;
            border-radius: 10px; background: #2563eb; color: #fff;
            font-size: 15px; font-weight: 600; cursor: pointer;
        }
        button:hover { filter: brightness(0.95); }
        .row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
        a { color: #2563eb; text-decoration: none; font-size: 13px; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h1>비밀번호 재설정</h1>
        <p class="sub">이메일로 받은 코드와 새 비밀번호를 입력해주세요.</p>

        <div th:if="${error}" class="error-msg" th:text="${error}"></div>

        <form method="post" th:action="@{/reset-password}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <label for="email">이메일</label>
            <input id="email" name="email" type="email" placeholder="example@email.com" required />

            <label for="code">재설정 코드</label>
            <input id="code" name="code" type="text" placeholder="6자리 코드" required />

            <label for="password">새 비밀번호</label>
            <input id="password" name="password" type="password" placeholder="••••••••" required />

            <label for="passwordConfirm">새 비밀번호 확인</label>
            <input id="passwordConfirm" name="passwordConfirm" type="password" placeholder="••••••••" required />

            <button type="submit">비밀번호 재설정</button>
        </form>

        <div class="row">
            <a th:href="@{/forgot-password}">코드 다시 받기</a>
            <a th:href="@{/login}">로그인으로</a>
        </div>
    </div>
</div>
</body>
</html>
