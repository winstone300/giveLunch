spring:
  application:
    name: giveLunch
  profiles:
    active: local
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,httpexchanges
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles:
        http.server.requests: 0.5,0.95,0.99
      percentiles-histogram:
        http.server.requests: true
        hikaricp.connections.acquire: true
        hikaricp.connections.usage: true

app:
  observability:
    enabled: true
    run-id-header: X-LoadTest-Run-Id
    scenario-header: X-LoadTest-Scenario
    sql:
      enabled: true
      slow-query-ms: 200
  menu:
    defaults:
      - 김치찌개
      - 제육볶음
      - 돈까스
    suggest:
      candidate-fetch-limit: 200
      result-limit: 10
