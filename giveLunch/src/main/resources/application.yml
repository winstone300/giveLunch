spring:
  application:
    name: giveLunch
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,beans
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        givelunch.sql.query: true
      slo:
        http.server.requests: 100ms,300ms,500ms,1s,3s

app:
  mail:
    from: ${APP_MAIL_FROM:${spring.mail.username:}}
    from-name: ${APP_MAIL_FROM_NAME:GiveLunch}
  rank:
    retention: ${APP_RANK_RETENTION:24h}
  observability:
    enabled: true
    run-id-header: X-LoadTest-Run-Id
    scenario-header: X-LoadTest-Scenario
    sql:
      enabled: true
      slow-query-ms: 200
  menu:
    defaults:
      - 김치찌개
      - 제육볶음
      - 돈까스
    suggest:
      candidate-fetch-limit: 200
      result-limit: 10
