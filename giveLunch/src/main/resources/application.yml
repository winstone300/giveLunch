spring:
  application:
    name: giveLunch
  profiles:
    default: local

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        givelunch.sql.query: true
      slo:
        http.server.requests: 100ms,300ms,500ms,1s,3s

app:
  observability:
    enabled: true
    run-id-header: X-LoadTest-Run-Id
    scenario-header: X-LoadTest-Scenario
    sql:
      enabled: true
      slow-query-ms: 200
  menu:
    defaults:
      - 김치찌개
      - 제육볶음
      - 돈까스
    suggest:
      candidate-fetch-limit: 200
      result-limit: 10
