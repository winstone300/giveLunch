name: CI/CD Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: giveLunch

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Test and Build
        run: ./mvnw -B clean package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: givelunch-jar
          path: giveLunch/target/giveLunch-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: givelunch-jar
          path: deploy-artifact

      - name: Deploy
        run: |
          DEPLOY_DIR=/home/ec2-user/giveLunch/giveLunch
          JAR_NAME=giveLunch-0.0.1-SNAPSHOT.jar

          cp "deploy-artifact/${JAR_NAME}" "${DEPLOY_DIR}/target/${JAR_NAME}.new"
          mv "${DEPLOY_DIR}/target/${JAR_NAME}.new" "${DEPLOY_DIR}/target/${JAR_NAME}"

          sudo /usr/bin/systemctl restart givelunch
          sleep 10
          curl -f http://localhost:8080/ || exit 1
